<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0a14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Orbe Negocios">
<title>Orbe Negocios</title>
<style>
  html, body { margin: 0; background: #0b0a14; color: #efeefe; font-family: Inter, -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .cargando { position: fixed; inset: 0; display: grid; place-items: center; }
  .cargando svg { animation: latido 1.2s cubic-bezier(0.32, 0.72, 0, 1) infinite alternate; }
  @keyframes latido { from { opacity: .5; transform: scale(.94); } to { opacity: 1; transform: none; } }
  .aviso { padding: 40px 20px; text-align: center; color: #9a97b8; }
  /* Teléfono: la app ocupa toda la pantalla, respetando la muesca y la barra de abajo. */
  .tel { position: fixed; inset: 0; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); box-sizing: border-box; overflow: hidden; }
  .tel > div { width: 100% !important; height: 100% !important; }
  /* Teléfono abierto en una pantalla grande (por ejemplo ?vista=telefono): se centra con su marco. */
  .tel.marco { display: flex; align-items: center; justify-content: center; padding: 0; }
  .tel.marco > div { width: 390px !important; height: 844px !important; flex: none; border-radius: 44px; overflow: hidden; box-shadow: 0 0 0 10px #1c1a30, 0 30px 80px rgba(0,0,0,.6); }
  @media (prefers-reduced-motion: reduce) { .cargando svg { animation: none; } }
</style>
<script src="lib/preact.min.js"></script>
</head>
<body>
<div id="app"><div class="cargando"><svg width="64" height="64" viewBox="0 0 92 92" role="img" aria-label="Cargando Orbe Negocios"><rect width="92" height="92" rx="26" fill="#16142a"/><circle cx="38" cy="40" r="19" fill="none" stroke="#8f84ff" stroke-width="5"/><circle cx="54" cy="40" r="19" fill="none" stroke="#3ddc9f" stroke-width="5"/><circle cx="46" cy="54" r="19" fill="none" stroke="#f0a020" stroke-width="5"/></svg></div></div>
<script>
// Orbe Negocios (demo de las maquetas). Abre sola la versión de teléfono o de computadora según el aparato.
// Se puede forzar con ?vista=telefono o ?vista=pc, y elegir datos con ?pais=CO&tipo=comida&escala=empresa.
(function () {
  var h = preact.h, q = new URLSearchParams(location.search);
  var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;

  function esTelefono() {
    var v = q.get('vista');
    if (v === 'telefono') return true;
    if (v === 'pc') return false;
    var corto = Math.min(screen.width, screen.height);
    var tactil = window.matchMedia('(pointer: coarse)').matches;
    var movil = /Android.+Mobile|iPhone|iPod|Windows Phone/i.test(navigator.userAgent);
    return movil || (tactil && corto < 600) || window.innerWidth < 600;
  }
  var tel = esTelefono();
  var props = {};
  ['pantalla', 'pais', 'tipo', 'escala'].forEach(function (k) { if (q.get(k)) props[k] = q.get(k); });
  if (!tel && !props.pais) props.pais = 'VE';

  function resolve(path, scope) {
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (path === 'null') return null;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    var parts = path.split('.'), v = scope;
    for (var i = 0; i < parts.length; i++) { if (v == null) return undefined; v = v[parts[i]]; }
    return v;
  }
  function text(v) { return v == null || v === false || v === true ? '' : String(v); }
  function attrFn(raw) {
    var whole = raw.match(/^\{\{\s*([^}]+?)\s*\}\}$/);
    if (whole) return function (s) { return resolve(whole[1], s); };
    if (raw.indexOf('{{') < 0) return function () { return raw; };
    return function (s) { return raw.replace(HOLE, function (_, p) { return text(resolve(p, s)); }); };
  }
  function kidsFn(node) {
    var fns = [];
    node.childNodes.forEach(function (c) { var f = compile(c); if (f) fns.push(f); });
    return function (s) { var out = []; fns.forEach(function (f) { var r = f(s); if (Array.isArray(r)) out.push.apply(out, r); else if (r != null) out.push(r); }); return out; };
  }
  function compile(node) {
    if (node.nodeType === 3) {
      var t = node.nodeValue;
      if (t.indexOf('{{') < 0) return function () { return t; };
      return function (s) { return t.replace(HOLE, function (_, p) { return text(resolve(p, s)); }); };
    }
    if (node.nodeType !== 1) return null;
    var tag = node.localName;
    if (tag === 'helmet' || tag === 'script') return null;
    var kids = kidsFn(node);
    if (tag === 'sc-if') {
      var cond = attrFn(node.getAttribute('value') || '');
      return function (s) { return cond(s) ? kids(s) : null; };
    }
    if (tag === 'sc-for') {
      var list = attrFn(node.getAttribute('list') || ''), as = node.getAttribute('as') || 'item';
      return function (s) {
        var arr = list(s) || [], out = [];
        arr.forEach(function (item, i) { var sc = Object.create(s); sc[as] = item; sc.$index = i; out.push.apply(out, kids(sc)); });
        return out;
      };
    }
    var attrs = [];
    Array.prototype.forEach.call(node.attributes, function (a) {
      var n = a.name;
      if (/^hint-/.test(n)) return;
      if (n === 'onchange' && (tag === 'input' || tag === 'textarea')) n = 'oninput';
      attrs.push([n, attrFn(a.value)]);
    });
    return function (s) {
      var p = {};
      attrs.forEach(function (a) { var v = a[1](s); if (v !== undefined && v !== null) p[a[0]] = v; });
      return h.apply(null, [tag, p].concat(kids(s)));
    };
  }

  var archivo = tel ? 'Fase1' : 'PCEmpresa';
  fetch('maquetas/fase1/' + archivo + '.dc.html').then(function (r) {
    if (!r.ok) throw new Error('No se pudo abrir Orbe Negocios. Revisa tu conexión.');
    return r.text();
  }).then(function (src) {
    var doc = new DOMParser().parseFromString(src, 'text/html');
    var dc = doc.querySelector('x-dc');
    var helmet = dc.querySelector('helmet');
    if (helmet) Array.prototype.forEach.call(helmet.children, function (el) { document.head.appendChild(document.importNode(el, true)); });
    var codigo = doc.querySelector('script[data-dc-script]').textContent;

    var programado = false, comp;
    function DCLogic(p) { this.props = p || {}; this.state = {}; }
    DCLogic.prototype.setState = function (o) {
      var nuevo = typeof o === 'function' ? o(this.state, this.props) : o;
      this.state = Object.assign({}, this.state, nuevo);
      programar();
    };
    DCLogic.prototype.forceUpdate = function () { programar(); };
    var Component = new Function('DCLogic', codigo + '\n;return Component;')(DCLogic);
    var plantilla = kidsFn(dc);
    var app = document.getElementById('app');
    app.innerHTML = '';
    if (tel) {
      app.className = 'tel';
      var conMarco = function () { app.classList.toggle('marco', window.innerWidth >= 600 && window.innerHeight >= 880); };
      window.addEventListener('resize', conMarco);
      conMarco();
    }
    function dibujar() {
      programado = false;
      preact.render(h(preact.Fragment, null, plantilla(comp.renderVals())), app);
    }
    function programar() { if (!programado && comp) { programado = true; requestAnimationFrame(dibujar); } }
    comp = new Component(props);
    dibujar();
    if (comp.componentDidMount) comp.componentDidMount();
  }).catch(function (e) {
    document.getElementById('app').innerHTML = '<p class="aviso">' + String(e.message || e) + '</p>';
  });
})();
</script>
</body>
</html>
