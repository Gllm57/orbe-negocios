<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0a14">
<meta name="description" content="Orbe Negocios: vende, cobra y mira cuánto ganas, desde el teléfono o la computadora.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Orbe Negocios">
<title>Orbe Negocios</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icono.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icono-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/orbe.css">
<link rel="modulepreload" href="js/lib/preact-htm.js">
</head>
<body>
<div id="app"></div>
<div class="splash" id="splash" role="status" aria-label="Cargando Orbe Negocios">
  <svg class="sp-logo" viewBox="0 0 92 92" aria-hidden="true">
    <g class="sp-gira">
      <circle class="sp-c sp-c1" cx="35" cy="39.7" r="23" pathLength="100"/>
      <circle class="sp-c sp-c2" cx="57" cy="39.7" r="23" pathLength="100"/>
      <circle class="sp-c sp-c3" cx="46" cy="58.7" r="23" pathLength="100"/>
    </g>
  </svg>
  <div class="sp-nombre">Orbe Negocios</div>
  <div class="sp-frase">Tú vendes. Orbe hace lo repetitivo.</div>
  <div class="sp-negocio" id="sp-negocio" hidden></div>
  <div class="sp-barra"><i></i></div>
  <p class="sp-error" id="sp-error" hidden>No se pudo abrir Orbe Negocios. Revisa tu conexión y vuelve a intentarlo.</p>
</div>
<script>
// Pantalla de carga: tema y nombre del negocio desde el primer instante; se va cuando la app está lista.
(function () {
  var d = null; try { d = JSON.parse(localStorage.getItem('orbe-negocios-mini') || 'null'); } catch (e) {}
  var tema = d && d.tema;
  if (tema === 'claro') document.documentElement.setAttribute('data-theme', 'light');
  if (tema === 'oscuro') document.documentElement.setAttribute('data-theme', 'dark');
  if (d && d.nombre) { var n = document.getElementById('sp-negocio'); n.textContent = d.nombre; n.hidden = false; }
  var el = document.getElementById('splash'), t0 = Date.now(), listo = false;
  var rapido = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  window.__listo = function () {
    if (listo) return; listo = true;
    setTimeout(function () { el.classList.add('sale'); setTimeout(function () { el.remove(); }, 500); }, Math.max(0, (rapido ? 250 : 1500) - (Date.now() - t0)));
  };
  // Si la app no arranca (sin internet la primera vez, o un error), se avisa en vez de quedarse cargando para siempre.
  setTimeout(function () { if (!listo) { document.getElementById('sp-error').hidden = false; el.classList.add('con-error'); } }, 9000);
  window.addEventListener('error', function (e) { if (!listo && e.target && e.target.tagName === 'SCRIPT') { document.getElementById('sp-error').hidden = false; el.classList.add('con-error'); } }, true);
})();
</script>
<noscript><p style="padding:40px 20px;text-align:center">Orbe Negocios necesita JavaScript.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
